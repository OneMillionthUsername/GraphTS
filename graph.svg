<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Kanten zuerst -->
  <line x1="50" y1="50" x2="150" y2="50" stroke="#333" stroke-width="2" />
  <line x1="150" y1="50" x2="150" y2="150" stroke="#333" stroke-width="2" />

  <!-- Knoten -->
  <circle cx="50" cy="50" r="18" fill="#fff" stroke="#333" stroke-width="2" />
  <circle cx="150" cy="50" r="18" fill="#fff" stroke="#333" stroke-width="2" />
  <circle cx="150" cy="150" r="18" fill="#fff" stroke="#333" stroke-width="2" />

  <!-- Beschriftungen, zentriert im Knoten -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="16">a</text>
  <text x="150" y="50" text-anchor="middle" dominant-baseline="central" font-size="16">b</text>
  <text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-size="16">c</text>
</svg>